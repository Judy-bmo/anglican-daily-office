name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나씩. 진행 중인 배포는 취소하지 않고 기다린다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pages가 아직 꺼져 있으면 여기서 켠다.
      # (Settings 화면에서 직접 켜지 않아도 되도록)
      - name: Pages 켜기
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - name: 교회력·성서정과 검증
        run: npm test

      # 프로젝트 사이트는 /저장소이름/ 아래에 놓이고,
      # 사용자 사이트(<계정>.github.io)는 루트에 놓인다.
      - name: 공개 경로 계산
        run: |
          name='${{ github.event.repository.name }}'
          if [[ "$name" == *.github.io ]]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/$name/" >> "$GITHUB_ENV"
          fi

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
